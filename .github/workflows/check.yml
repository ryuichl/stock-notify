name: 美股 200MA Check

on:
  # 由外部 crontab 呼叫 workflow_dispatch (台灣時間 30 5 * * 2-6)，GitHub schedule 延遲數小時故不用
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check US stocks vs 200MA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_ma200.py us
